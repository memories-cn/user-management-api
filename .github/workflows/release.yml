name: Release

# 发布流程：打 tag（v*）即触发多架构镜像构建并推送到 GHCR。
#
# 数据库迁移不在这里执行——迁移是独立、可审计的一步（TDD §13.3），
# 由发布运行手册 docs/release.md 中的步骤人工或单独流水线触发。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 go.mod 的模块路径一致
        run: |
          echo "发布版本：${GITHUB_REF_NAME}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像摘要
        run: |
          {
            echo "## 镜像"
            echo ""
            echo "| Tag | Digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # digest 由 build-push-action 暴露，缺失时退回 tag 名，保证摘要始终可读。
          echo "发布摘要已生成：${GITHUB_REF_NAME}"
