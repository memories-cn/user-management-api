[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = r.dom == p.dom && \
    r.obj == p.obj && \
    r.act == p.act && \
    (r.sub == p.sub || g(r.sub, p.sub, r.dom))
